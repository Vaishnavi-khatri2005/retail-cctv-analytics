# ==========================================
# Google Cloud Build Configuration
# Builds container and deploys directly to Google Cloud Run
# ==========================================
steps:
  # Step 1: Build the unified container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/retail-cctv-analytics:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/retail-cctv-analytics:latest', '.']

  # Step 2: Push the container image to Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/retail-cctv-analytics:$COMMIT_SHA']

  # Step 3: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'retail-cctv-analytics'
      - '--image'
      - 'gcr.io/$PROJECT_ID/retail-cctv-analytics:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'

images:
  - 'gcr.io/$PROJECT_ID/retail-cctv-analytics:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/retail-cctv-analytics:latest'

options:
  logging: CLOUD_LOGGING_ONLY
